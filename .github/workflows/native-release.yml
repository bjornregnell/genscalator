# Builds the tt native-image dispatcher on every supported platform, proves each binary with the
# FULL CLI-contract suite run THROUGH that binary, packages a self-contained archive per platform,
# and attaches the archives plus checksums to a GitHub release.
#
# Design record: reqts/DESIGN.md D3 (the per-platform archive) and D4 (why skills/ is not in it).
#
# DELIBERATELY NOT triggered by push. A release build is an act, not a side effect.

name: native-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (blank = build only, attach nothing)"
        required: false
  release:
    types: [published]

permissions:
  contents: read                # the publish job re-declares write; build jobs never need it

jobs:
  gate:
    # Release gate, one job serving two issues (021's review: one gate serves both):
    #
    # issue-012: `inputs.tag` is FREE TEXT with two downstream uses — it is stamped into
    # staging/VERSION.txt at build time and handed to `gh release upload "$TAG" --clobber` at
    # publish time. A typo therefore mis-stamps every binary AND clobbers assets on whatever
    # release the typo happens to name. So the tag must first LOOK like a release tag (shape)
    # and then BE one (an existing git tag on the remote) before anything downstream may
    # trust it. Release-event tags come from GitHub itself, but validating them is one string
    # through the same checks — cheap, and it keeps a single code path honest.
    #
    # issue-021: refuse to build for a tag that disagrees with the in-repo version
    # carriers. VERSION.txt is the single in-repo source and VersionSuite (run per-leg through the
    # build-and-prove step) pins plugin.json/marketplace.json/AGENTS.md to it — so this one
    # comparison transitively gates every carrier. The `v` prefix belongs to the tag alone,
    # carriers stay bare; hence the normalization. A blank tag = build-only run, nothing to gate.
    #
    # Check order is deliberate: shape, then existence, then carrier match — each check assumes
    # only what the previous one proved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Default shallow checkout is enough: the carrier check reads VERSION.txt from the working
        # tree, and the existence check asks the REMOTE (ls-remote below), not the local clone —
        # checkout@v4 has a history of not materializing tag refs under a shallow fetch even with
        # `fetch-tags: true` (a release tag usually points behind the fetched tip), which would
        # make every legitimate run fail its own gate.
      - name: Tag is well-shaped, exists, and matches the in-repo version carriers
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # Via env ON PURPOSE, never `${{ }}` inside `run:`: template expansion pastes the free
          # text INTO the script before bash ever runs, so an injection would fire before any of
          # the checks below could see it. As an environment variable it is inert data.
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then echo "no tag in play - build-only run, gate passes"; exit 0; fi
          # Shape (issue-012): a release tag is `v` + dotted numerics + optional suffix
          # (v0.10.1, v1.0.0-RC1). Anything else is a typo or garbage; name it and stop.
          # The regex lives in a variable because bash `=~` mangles quoted patterns.
          shape='^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $shape ]]; then
            echo "RELEASE GATE (issue-012): tag '$tag' does not look like a release tag."
            echo "Expected shape: v<major>.<minor>.<patch> with an optional suffix, e.g. v0.10.1 or v1.0.0-RC1 (regex: $shape)."
            exit 1
          fi
          # Existence (issue-012): publish runs `gh release upload "$tag" --clobber`, so a
          # well-shaped typo would clobber assets on whatever release it happens to name. An
          # upload target must be a REAL tag in this repository; a typo dies here, in seconds.
          # Asked of the REMOTE (ls-remote), not the local clone, on purpose: the answer must not
          # depend on what the shallow checkout happened to fetch. --exit-code returns 2 when the
          # ref does not exist; stdout (the matching ref line) is noise here, so silence it.
          if ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "RELEASE GATE (issue-012): tag '$tag' is not an existing git tag in this repository."
            echo "An upload target must be a real release tag - create and push the tag (and its release) BEFORE dispatching."
            exit 1
          fi
          # Carrier match (issue-021): see the job comment above.
          want="${tag#v}"
          have="$(tr -d '[:space:]' < VERSION.txt)"
          if [ "$want" != "$have" ]; then
            echo "RELEASE GATE (issue-021): tag $tag declares $want but VERSION.txt says $have."
            echo "Bump the carriers (VERSION.txt, plugin.json, marketplace.json, AGENTS.md, CHANGELOG) BEFORE tagging."
            exit 1
          fi
          echo "gate passes: tag $tag is well-shaped, exists as a git tag, and == VERSION.txt $have"

  build:
    needs: gate
    strategy:
      fail-fast: false          # one platform failing must never mask the others' results
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          # ⚠ macos-13 (Intel) was REMOVED from this matrix on 2026-07-27, and NOT by marking it
          # experimental. That distinction is the point: `continue-on-error` excuses a leg that FAILS,
          # and this one never failed — it never STARTED. Two runs sat queued 2h30m+ waiting for an
          # Intel runner and were cancelled unfinished. Since `publish` has `needs: build`, which waits
          # for every leg to reach a terminal state, one perpetually-queued leg holds the whole release
          # hostage. Marking it experimental would have looked like a fix and changed nothing.
          #
          # Nothing shipped is lost: this leg has NEVER produced an artifact, not once. Apple Silicon is
          # covered by macos-latest below, and an Intel Mac can still build from source.
          #
          # The way back, when someone wants Intel coverage again: give it its OWN job that `publish`
          # does not depend on. That means the build steps must first be extracted into a composite
          # action, because copying them is the drift failure D4 exists to prevent — which is exactly
          # why it was not done as a quick fix here.
          - os: macos-latest      # Apple Silicon
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
            exe: .exe
          - os: windows-11-arm
            platform: windows-aarch64
            exe: .exe
            experimental: true
            # Shipped EXPERIMENTAL on purpose (DESIGN D3): newest, least-proven runner, published so
            # an unusual-platform tester can try it and report. Must be labelled experimental in the
            # release notes, or a published asset reads as a supported one.

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/cache-action@v6
        # Caches the coursier cache, which is where scala-cli puts the JVM, the compiler artifacts AND
        # the GraalVM it fetches for native-image. That download is the bulk of a cold leg, and it is
        # paid SIX times per run. Recommended by the scala-cli docs alongside the setup action below.
        # Correctness-neutral: a cold cache builds exactly the same binary, only slower.

      - uses: VirtusLab/scala-cli-setup@v1
        # scala-cli fetches its own GraalVM, so there is no separate GraalVM provisioning step.
        #
        # Pinned to @v1, NOT the @main the docs show. A moving branch in a release-artifact pipeline
        # means the thing that built today's binary is not the thing that builds tomorrow's, and this
        # workflow produces assets people install. @main would also not help the one leg that fails
        # here: windows-aarch64 404s because VirtusLab publishes no aarch64-pc-win32 build at all
        # (checked against the release assets, 2026-07-27), and no action version conjures one.

      - name: MSVC environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        # native-image shells out to the MSVC linker and expects the environment a "x64 Native Tools"
        # prompt sets up. Without this the build fails late and cryptically.

      - name: Build and prove
        run: scala-cli run deploy/buildnative.sc -- --out "staging/bin/tt${{ matrix.exe }}" --mem-floor off
        # NO `shell:` and NO line continuations, ON PURPOSE. scala-cli-setup installs scala-cli.bat on
        # Windows, and Git Bash does not do PATHEXT resolution, so `shell: bash` there gave
        # "scala-cli: command not found" and exit 127 (run 30253863769). Letting each OS use its
        # default shell fixes it, which in turn means the command must contain no shell-specific
        # syntax: hence one line, and no --root, since buildnative.sc already defaults to the cwd and
        # Actions runs steps in the workspace root.
        #
        # --mem-floor off: the 6 GB floor is right on a dev box and wrong on a runner, where
        # MemAvailable is not a good proxy for what a job may use. It is Linux-only regardless.
        # The build -> parity -> swap ritual is otherwise the SAME one a human runs locally, so
        # there is no second build path to keep honest.

      - name: Stage the self-contained payload
        shell: bash
        run: |
          cp -r docs staging/docs
          mkdir -p staging/reqts && cp reqts/PRD.md staging/reqts/PRD.md
          echo "${{ github.event.release.tag_name || inputs.tag || 'dev' }}" > staging/VERSION.txt
          # NO tools/*.scala: checked 2026-07-27, not one runtime verb reads it (DESIGN D3).
          # NO skills/: the Claude Code plugin owns those, and shipping a second copy here is the
          # drift failure D4 exists to prevent.

      - name: Prove the shipped uninstaller matches what was just staged
        run: scala-cli run deploy/payloadsync.sc -- --staged staging
        # Issue 040. get-genscalator.sc's pre-manifest uninstall fallback has to name the payload's
        # top-level entries, and that list was hand-typed: it missed `reqts` (leftover, then blamed on
        # the user) and claimed `skills`, `tools`, `plugins` (a user's own files walked and deleted).
        # The list is now GENERATED from the step above, and this is the check that the generated
        # region agrees with the tree that step actually produced. It runs HERE, between staging and
        # archiving, because this is the only moment the real payload exists — before the zip is
        # built and long before anyone installs it.
        #
        # A test also asserts the region against a regeneration (PayloadLayoutSuite), but that test
        # and the generator share a parser. This step shares nothing with it: it lists the directory.
        # A drift fails the release, which is the correct blast radius — the alternative is shipping
        # an uninstaller that deletes the wrong set.
        #
        # NO `shell:` and one line, for the reason the build step gives above: scala-cli resolves via
        # PATHEXT on Windows and Git Bash does not, so this must contain no shell-specific syntax.

      - name: Archive and checksum
        shell: bash
        run: |
          mkdir -p dist
          name="genscalator-${{ matrix.platform }}"
          # ⚠ `zip` is NOT on the Windows runners — Git Bash ships no zip binary, so this step died with
          # "zip: command not found" (exit 127) on the FIRST run where everything before it succeeded.
          # 7-Zip IS preinstalled there. The ARCHIVE FORMAT stays zip on every platform regardless: D3
          # picks zip because the JDK reads it via java.util.zip, so the installer needs neither a
          # library nor a subprocess. Only the writer differs, never the format.
          if command -v zip >/dev/null; then (cd staging && zip -qr "../dist/$name.zip" .)
          else (cd staging && 7z a -tzip -bso0 -bsp0 "../dist/$name.zip" .); fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.zip" > "$name.zip.sha256"
          else shasum -a 256 "$name.zip" > "$name.zip.sha256"; fi
        # zip, not tar.gz: the JDK reads zip with java.util.zip and no dependency, so the installer
        # needs neither a library nor a subprocess (DESIGN D3). The installer verifies this digest
        # and aborts on mismatch.

      - uses: actions/upload-artifact@v4
        with:
          name: genscalator-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write           # narrowest scope that can attach release assets
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
